[project]
name = "comfyui-krea2-pose-control"
description = "Pose Control LoRA nodes for Krea-2 in ComfyUI"
version = "1.0.1"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "safetensors>=0.5",
    "diffusers>=0.33",
    "transformers>=4.51",
    "huggingface_hub>=0.30",
    "einops>=0.8",
    "Pillow>=10",
    "numpy>=1.26,<2",
]

[project.urls]
Repository = "https://github.com/s-adhit/ComfyUI-Krea2-Pose"
Documentation = "https://github.com/s-adhit/ComfyUI-Krea2-Pose#readme"

[tool.comfy]
PublisherId = "adhit-42"
DisplayName = "Krea-2 Pose Control LoRA"